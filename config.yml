# Roam configuration

# static (cannot be changed in game)
# displayWidth/displayHeight default to 90% of display height when omitted.
# displayWidth: 972
# displayHeight: 972
playerMovementEnergyCost: 0.2
playerInteractionEnergyCost: 0.05
runSpeedFactor: 2
energyDepletionRate: 0.01
playerInteractionDistanceLimit: 5
ticksPerSecond: 30
gridSize: 17
worldBorder: 0
excrementDecayTicks: 3600
# Ticks for a planted crop to grow to maturity (30 tps → 1800 ticks ≈ 60s).
cropGrowthTicks: 1800
# pathToSaveDirectory: leave unset to use the platform default save location
# ("saves/defaultsavefile", or %APPDATA%\Roam\saves\defaultsavefile on Windows).
# Set it explicitly to override, e.g. pathToSaveDirectory: saves/defaultsavefile
# Web frontend ports — change these if the defaults conflict with other services.
webHttpPort: 8282
webWsPort: 8766
# Read-only REST API for external client tools (e.g. a world viewer). Opt-in;
# disabled by default. Endpoints are documented in src/api/restApiServer.py.
restEnabled: false
restPort: 8090

# dynamic (can be changed in game)
debug: true
fullscreen: false
autoEatFoodInInventory: true
removeDeadEntities: true
showMiniMap: true
cameraFollowPlayer: true
limitTps: true
pushableStone: true
dayNightCycleEnabled: true
dayNightCycleLengthTicks: 54000
# Check GitHub for a newer release on launch and show a notice on the main menu.
# Set to false to disable the update check. Roam's only other network requests
# are usage reporting (usageReportingEnabled, below) and, with npcMode: cpc,
# the Claude API.
checkForUpdates: true
# Anonymous usage reporting: on launch Roam sends a "startup" event, and on
# opening a save a "world-loaded" event, to https://trace.danielstephenson.dev.
# Each carries the program name ("roam") and the game version only — never a
# username, machine name, address, path or save name. Never sent from the
# browser build. On by default; the first launch logs a one-line notice and
# writes usageReportingEnabled here so it is not shown again.
# usageReportingEnabled: false
# usageReportingEndpoint and usageReportingKey may be set here to point a
# build at a different trace server; the defaults are built in.
# NPCs / CPCs — autonomous agents that mimic player behavior.
# npcMode: "npc" = deterministic FSM; "cpc" = Claude AI (requires ANTHROPIC_API_KEY)
npcEnabled: true
npcCount: 1
npcMode: npc
# Radius of rooms around the player where NPCs are actively ticked (1 = 3x3 grid).
npcSimulationRadius: 1
savedWindowWidth: 1079
savedWindowHeight: 1603
